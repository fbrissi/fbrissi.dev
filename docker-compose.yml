services:
  app:
    image: kooldev/node:24
    command: yarn dev
    ports:
      - "3000:3000"
    environment:
      ASDF_NODEJS_VERSION: 20
      NEXT_PUBLIC_CONTACT_API_URL: http://localhost:8787/api/contact
      # `next dev` proxies /api/study-group/* to the local API so the session cookie stays same-origin.
      STUDY_GROUP_API_PROXY_URL: http://study-group-api:8788
      STUDY_GROUP_SLUG: local
    volumes:
      - .:/app:delegated
    networks:
      - kool_local
      - kool_global
    depends_on:
      - mailpit
      - contact-api
      - study-group-api

  contact-api:
    image: kooldev/node:24
    command: yarn dev:contact-api
    environment:
      ASDF_NODEJS_VERSION: 20
      LOCALSTACK_ENDPOINT: http://localstack:4566
    ports:
      - "8787:8787"
    volumes:
      - .:/app:delegated
    networks:
      - kool_local
    depends_on:
      localstack:
        condition: service_healthy

  # Study group API backed by node:sqlite; data persists in the gitignored tmp/study-group/.
  study-group-api:
    image: kooldev/node:24
    command: yarn dev:study-group-api
    environment:
      ASDF_NODEJS_VERSION: 24
      STUDY_GROUP_DB_PATH: tmp/study-group/local.sqlite
      STUDY_GROUP_APP_ORIGIN: http://localhost:3000
      STUDY_GROUP_ALLOWED_ORIGINS: http://localhost:3000
      STUDY_GROUP_SESSION_SECRET: local-dev-session-secret-not-for-production
      STUDY_GROUP_PLATFORM_ADMIN_EMAILS: admin@example.test
      # Local-only fake Google IdP: the browser opens the public URL, the API calls it on the Docker network.
      FAKE_IDP_PUBLIC_URL: http://localhost:8790
      FAKE_IDP_INTERNAL_URL: http://fake-idp:8790
    ports:
      - "8788:8788"
    volumes:
      - .:/app:delegated
    networks:
      - kool_local
    depends_on:
      - fake-idp

  # Fake Google OpenID Connect provider for local sign-in and E2E tests (never used in production).
  fake-idp:
    image: kooldev/node:24
    command: yarn dev:fake-idp
    environment:
      ASDF_NODEJS_VERSION: 24
      FAKE_IDP_PUBLIC_URL: http://localhost:8790
    ports:
      - "8790:8790"
    volumes:
      - .:/app:delegated
    networks:
      - kool_local

  contact-email-consumer:
    image: kooldev/node:24
    command: yarn dev:contact-email-consumer
    environment:
      ASDF_NODEJS_VERSION: 20
      LOCALSTACK_ENDPOINT: http://localstack:4566
      MAILPIT_SMTP_HOST: mailpit
      MAILPIT_SMTP_PORT: 1025
      CONTACT_EMAIL_FROM: no-reply@fbrissi.dev
      CONTACT_EMAIL_TO: contact@fbrissi.dev
    volumes:
      - .:/app:delegated
    networks:
      - kool_local
    depends_on:
      localstack:
        condition: service_healthy
      mailpit:
        condition: service_started

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    networks:
      - kool_local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mailpit - Local email testing (like Mailtrap/MailHog)
  # Web UI: http://localhost:8025
  # SMTP: localhost:1025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP server
    volumes:
      - mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_API_CORS: localhost:3000
    networks:
      - kool_local

networks:
  kool_local:
  kool_global:
    external: true
    name: kool_global

volumes:
  mailpit_data:
