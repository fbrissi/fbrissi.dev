scripts:
  yarn: kool docker kooldev/node:24 yarn
  npm: kool docker kooldev/node:24 npm
  audit: kool docker kooldev/node:24 env npm_config_userconfig=/dev/null npm audit --audit-level=high --no-package-lock
  actionlint: sh -c 'kool docker rhysd/actionlint:latest .github/workflows/*.yml'
  # Playwright E2E against the running local stack (kool start); resets the local study group database.
  e2e: bash e2e/run.sh
  # Runs the hourly meeting reminder scan of the local study group API now; the emails land in Mailpit.
  meeting-reminders: kool exec study-group-api curl -fsS -X POST http://localhost:8788/__local/meeting-reminders

  setup:
    - kool run yarn install
    - kool start

  share: sh -c 'docker run --rm --init --network $(basename $(pwd) | tr -d "." | tr "[:upper:]" "[:lower:]")_kool_local beyondcodegmbh/expose-server:1.4.1 share http://app:3000 --server-host kool.live'

  quality:
    - kool run actionlint
    - kool run yarn lint:fix
    - kool run yarn typecheck
    - kool run yarn build
    - kool run yarn test:coverage
    - kool run npm audit --audit-level=high --no-package-lock
