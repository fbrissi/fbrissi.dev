name = "fbrissi-dev-contact-email-consumer"
main = "../contact-email-consumer.ts"
compatibility_date = "2024-01-01"
workers_dev = false
observability.enabled = true

[[queues.consumers]]
queue = "fbrissi-dev-contact-form"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 30
dead_letter_queue = "fbrissi-dev-contact-form-dlq"

[[send_email]]
name = "SEND_EMAIL"

[vars]
CONTACT_EMAIL_TO = "f.b.rissi@gmail.com"
CONTACT_EMAIL_DISPLAY_TO = "contact@fbrissi.dev"
CONTACT_EMAIL_FROM = "no-reply@fbrissi.dev"

# Sandbox consumer (fbrissi-dev-contact-email-consumer-sandbox), deployed only by .github/workflows/sandbox.yml while
# the sandbox is enabled (terraform/locals.tf). Bindings and vars aren't inherited, so each one is repeated here.
[env.sandbox]
name = "fbrissi-dev-contact-email-consumer-sandbox"
workers_dev = false

[[env.sandbox.queues.consumers]]
queue = "fbrissi-dev-sandbox-contact-form"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 30
dead_letter_queue = "fbrissi-dev-sandbox-contact-form-dlq"

[[env.sandbox.send_email]]
name = "SEND_EMAIL"

[env.sandbox.vars]
CONTACT_EMAIL_TO = "f.b.rissi@gmail.com"
CONTACT_EMAIL_DISPLAY_TO = "contact@fbrissi.dev"
CONTACT_EMAIL_FROM = "no-reply@fbrissi.dev"
