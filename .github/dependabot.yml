version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    assignees: [fbrissi]
    commit-message:
      prefix: chore
      include: scope

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: terraform
    directory: /terraform
    patterns: ["*"]
    multi-ecosystem-group: dependencies
