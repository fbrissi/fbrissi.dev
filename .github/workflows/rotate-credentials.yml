name: Rotate Deployment Credentials

on:
  schedule:
    # 04:00 Brasília time on January 1 and July 1.
    - cron: "0 7 1 1,7 *"
  workflow_dispatch:
    inputs:
      mode:
        description: bootstrap and manual copy the manual credentials to Terraform Cloud; automatic also replaces the deployment credentials.
        required: true
        type: choice
        options:
          - bootstrap
          - manual
          - automatic
        default: automatic

permissions: {}

concurrency:
  group: rotate-deployment-credentials
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate Cloudflare credentials
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
    timeout-minutes: 40
    env:
      MODE: ${{ github.event_name == 'schedule' && 'automatic' || inputs.mode }}
      TFC_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
      TFC_ORGANIZATION: fbrissi
      TFC_WORKSPACE: fbrissi-dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Terraform credential lives only as a GitHub secret; Terraform Cloud receives a copy.
      - name: Synchronize Terraform Cloud variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "$TFC_API_TOKEN" ] || missing+=(TFC_API_TOKEN)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          api() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $TFC_API_TOKEN" \
              --header 'Content-Type: application/vnd.api+json' \
              "$@"
          }

          workspace_id=$(api "https://app.terraform.io/api/v2/organizations/$TFC_ORGANIZATION/workspaces/$TFC_WORKSPACE" | jq --raw-output '.data.id')
          variable_id=$(api "https://app.terraform.io/api/v2/workspaces/$workspace_id/vars" \
            | jq --raw-output '.data[] | select(.attributes.key == "CLOUDFLARE_API_TOKEN" and .attributes.category == "terraform") | .id')

          payload=$(jq --null-input --arg id "$variable_id" '{
            data: ({
              type: "vars",
              attributes: { key: "CLOUDFLARE_API_TOKEN", value: $ENV.CLOUDFLARE_API_TOKEN, category: "terraform", sensitive: true }
            } + (if $id == "" then {} else { id: $id } end))
          }')

          if [ -n "$variable_id" ]; then
            api --request PATCH --data @- "https://app.terraform.io/api/v2/workspaces/$workspace_id/vars/$variable_id" <<<"$payload" >/dev/null
          else
            api --request POST --data @- "https://app.terraform.io/api/v2/workspaces/$workspace_id/vars" <<<"$payload" >/dev/null
          fi
      - name: Replace credentials in Terraform Cloud
        if: ${{ env.MODE == 'automatic' }}
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $TFC_API_TOKEN" \
              --header 'Content-Type: application/vnd.api+json' \
              "$@"
          }

          workspace_id=$(api "https://app.terraform.io/api/v2/organizations/$TFC_ORGANIZATION/workspaces/$TFC_WORKSPACE" | jq --raw-output '.data.id')

          payload=$(jq --null-input --arg workspace_id "$workspace_id" '{
            data: {
              type: "runs",
              attributes: {
                message: "Rotate deployment credentials",
                "auto-apply": true,
                "replace-addrs": [
                  "cloudflare_account_token.deploy",
                  "cloudflare_turnstile_widget.contact_form"
                ]
              },
              relationships: {
                workspace: { data: { type: "workspaces", id: $workspace_id } }
              }
            }
          }')
          run_id=$(api --request POST --data "$payload" https://app.terraform.io/api/v2/runs | jq --raw-output '.data.id')

          for _ in {1..180}; do
            status=$(api "https://app.terraform.io/api/v2/runs/$run_id" | jq --raw-output '.data.attributes.status')
            echo "Terraform Cloud run $run_id: $status"

            case "$status" in
              applied)
                exit 0
                ;;
              errored|canceled|force_canceled|discarded|policy_soft_failed|planned_and_finished)
                echo "Terraform Cloud did not apply the credential rotation."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Terraform Cloud run $run_id."
          exit 1
      # The replaced Turnstile widget has a new site key, so the latest release must be rebuilt. Sandbox is redeployed
      # manually with the Deploy Sandbox workflow.
      - name: Deploy latest release tag
        if: ${{ env.MODE == 'automatic' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            echo 'No release tag to deploy yet.'
            exit 0
          fi

          dispatched_at=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy.yml --ref "$latest_tag" -f "tag=$latest_tag"
          for _ in {1..30}; do
            run_id=$(gh run list --workflow deploy.yml --limit 20 --json databaseId,headBranch,event,createdAt \
              | jq --raw-output --arg tag "$latest_tag" --arg since "$dispatched_at" \
                '.[] | select(.headBranch == $tag and .event == "workflow_dispatch" and .createdAt >= $since) | .databaseId' \
              | head -n 1)
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --exit-status
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for deployment of $latest_tag."
          exit 1
