name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v1.0.0 or 1.0.0.
        required: true
        type: string
      prerelease:
        description: Mark as prerelease (versions with a suffix such as -beta.1 always are).
        required: false
        type: boolean
        default: false
      release_notes:
        description: Optional release notes. Leave empty to use the CHANGELOG.md section.
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: Release
    uses: fbrissi/github-actions/.github/workflows/release.yml@v1
    permissions:
      actions: write
      contents: write
    with:
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      release-notes: ${{ inputs.release_notes }}
      tfc-organization: fbrissi
      tfc-workspace: fbrissi-dev
      infrastructure-timeout-minutes: 360
      deploy-workflow: deploy.yml
    secrets: inherit
