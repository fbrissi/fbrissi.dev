name: AI Dependency Update

# Weekly, after the grouped Dependabot run (Monday 09:00 America/Sao_Paulo, 12:00 UTC): the dependency-updater agent
# sends security updates from the open Dependabot PR as a hotfix/ PR into main and the rest as a bugfix/ PR into the
# open release/* branch (they wait when there is none), profile docs/ai/dependency-updates.md. It only develops and
# opens the PRs: Code Review and QA run on each push, PR Fix fixes their findings, and Merge Decision rates the risk and
# holds, so a person merges.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      requested_by:
        description: GitHub login to mention when the flow needs a person. Empty uses whoever ran it.
        required: false
        type: string
      instructions:
        description: Extra instructions for this run only, appended to the agent prompt.
        required: false
        type: string

permissions: {}

concurrency:
  group: ai-dependency-update
  cancel-in-progress: false

jobs:
  dependency-update:
    name: AI Dependency Update
    # Skipped while the client-id variable is empty; a missing private key fails the run (AGENT_APP_CLIENT_ID variable and AGENT_APP_PRIVATE_KEY secret).
    if: github.ref == 'refs/heads/main' && vars.AGENT_APP_CLIENT_ID != ''
    uses: fbrissi/github-actions/.github/workflows/ai-task.yml@v1
    permissions:
      contents: read
    with:
      task: dependency-update
      harness: ${{ vars.AI_HARNESS }}
      opencode-model: ${{ vars.OPENCODE_MODEL }}
      opencode-variant: ${{ vars.OPENCODE_VARIANT }}
      claude-model: ${{ vars.CLAUDE_MODEL }}
      claude-effort: ${{ vars.CLAUDE_EFFORT }}
      ai-skills-ref: v0.15.0
      requested-by: ${{ inputs.requested_by }}
      instructions: ${{ inputs.instructions }}
      base-branch: main
      node-version: "24"
      node-cache: yarn
      install-command: yarn install --frozen-lockfile
      # The developer only: the review and QA run in their own workflows after the push.
      quality-mode: separate
      timeout-minutes: 50
    secrets:
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      OPEN_AI_TOKEN: ${{ secrets.OPEN_AI_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
