name: Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  warm-cache:
    name: Warm Dependency Cache
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: opencode-review-deps-v1-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            opencode-review-deps-v1-
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: yarn install --frozen-lockfile
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: opencode-review-deps-v1-${{ hashFiles('yarn.lock') }}

  quality:
    name: Quality / ${{ matrix.name }}
    needs: warm-cache
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dependency-audit
            command: npm audit --audit-level=high --no-package-lock
          - name: lint
            command: yarn lint
          - name: typecheck
            command: yarn typecheck
          - name: build
            command: yarn build
          - name: coverage
            command: yarn test:coverage --reporter=default --reporter=junit --outputFile.junit=vitest-report.xml
            artifact_name: test-coverage
            artifact_path: coverage
            summary_name: Frontend
            test_reporter_path: vitest-report.xml
            coverage_summary_path: coverage/cobertura-coverage.xml
            coverage_html_path: coverage/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Upload coverage report
        if: ${{ always() && matrix.artifact_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore
      - name: Publish test summary
        if: ${{ always() && matrix.summary_name != '' }}
        shell: bash
        env:
          SUMMARY_NAME: ${{ matrix.summary_name }}
          JUNIT_PATH: ${{ matrix.test_reporter_path }}
          COVERAGE_PATH: ${{ matrix.coverage_summary_path }}
          COVERAGE_HTML_PATH: ${{ matrix.coverage_html_path }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          get_attr() {
            local line="$1"
            local attr="$2"

            printf '%s\n' "$line" | sed -n "s/.* ${attr}=\"\([^\"]*\)\".*/\1/p" | head -n 1
          }

          tests='n/a'
          failures='n/a'
          errors='n/a'
          skipped='n/a'
          time='n/a'

          if [ -n "$JUNIT_PATH" ] && [ -f "$JUNIT_PATH" ]; then
            junit_line=$(grep -m 1 -E '<testsuites|<testsuite ' "$JUNIT_PATH" || true)

            if [ -n "$junit_line" ]; then
              tests=$(get_attr "$junit_line" tests)
              failures=$(get_attr "$junit_line" failures)
              errors=$(get_attr "$junit_line" errors)
              skipped=$(get_attr "$junit_line" skipped)
              time=$(get_attr "$junit_line" time)
            fi
          fi

          line_coverage='n/a'
          branch_coverage='n/a'

          if [ -n "$COVERAGE_PATH" ] && [ -f "$COVERAGE_PATH" ]; then
            coverage_line=$(grep -m 1 '<coverage ' "$COVERAGE_PATH" || true)
            line_rate=$(get_attr "$coverage_line" 'line-rate')
            branch_rate=$(get_attr "$coverage_line" 'branch-rate')

            if [ -n "$line_rate" ]; then
              line_coverage=$(awk "BEGIN { printf \"%.2f%%\", $line_rate * 100 }")
            fi

            if [ -n "$branch_rate" ]; then
              branch_coverage=$(awk "BEGIN { printf \"%.2f%%\", $branch_rate * 100 }")
            fi
          fi

          {
            echo "## $SUMMARY_NAME test report"
            echo
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo "| Tests | $tests |"
            echo "| Failures | $failures |"
            echo "| Errors | $errors |"
            echo "| Skipped | $skipped |"
            echo "| Duration | ${time}s |"
            echo "| Line coverage | $line_coverage |"
            echo "| Branch coverage | $branch_coverage |"
            echo
            echo "HTML coverage report is available in the \`$ARTIFACT_NAME\` artifact."
            if [ -n "$COVERAGE_HTML_PATH" ] && [ -f "$COVERAGE_HTML_PATH" ]; then
              echo "Entry point: \`$COVERAGE_HTML_PATH\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform
    needs: warm-cache
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  quality-jobs:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: [quality, terraform, release-note]
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    steps:
      - name: Validate quality results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          RELEASE_NOTE_RESULT: ${{ needs.release-note.result }}
        run: |
          set -euo pipefail

          if [ "$QUALITY_RESULT" != 'success' ] || [ "$TERRAFORM_RESULT" != 'success' ]; then
            echo "Quality result: $QUALITY_RESULT"
            echo "Terraform result: $TERRAFORM_RESULT"
            exit 1
          fi

          if [ "$RELEASE_NOTE_RESULT" != 'success' ] && [ "$RELEASE_NOTE_RESULT" != 'skipped' ]; then
            echo "Release note result: $RELEASE_NOTE_RESULT"
            exit 1
          fi

  release-note:
    name: Quality / release-note
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate new release note
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t versions < <(
            git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- CHANGELOG.md \
              | sed -nE 's/^\+## (v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$/\1/p'
          )

          if [ "${#versions[@]}" -ne 1 ]; then
            echo 'CHANGELOG.md must add exactly one release heading in the form ## vMAJOR.MINOR.PATCH.'
            exit 1
          fi

          version="${versions[0]}"
          notes=$(awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "Release $version must include release notes."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Release tag already exists: $version"
            exit 1
          fi
