name: Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

concurrency:
  group: quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  warm-cache:
    name: Warm Dependency Cache
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: code-review-deps-v1-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            code-review-deps-v1-node24-${{ runner.os }}-${{ runner.arch }}-
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: yarn install --frozen-lockfile
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: code-review-deps-v1-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

  quality:
    name: Quality / ${{ matrix.name }}
    needs: warm-cache
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dependency-audit
            command: node scripts/audit-high.mjs npm
          - name: lint
            command: yarn lint
          - name: typecheck
            command: yarn typecheck
          - name: build
            command: yarn build
          - name: coverage
            command: yarn test:coverage --reporter=default --reporter=junit --outputFile.junit=vitest-report.xml
            artifact_name: test-coverage
            artifact_path: coverage
            summary_name: Frontend
            test_reporter_path: vitest-report.xml
            coverage_summary_path: coverage/cobertura-coverage.xml
            coverage_html_path: coverage/index.html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - name: Upload coverage report
        if: ${{ always() && matrix.artifact_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore
      - name: Publish test summary
        if: ${{ always() && matrix.summary_name != '' }}
        shell: bash
        env:
          SUMMARY_NAME: ${{ matrix.summary_name }}
          JUNIT_PATH: ${{ matrix.test_reporter_path }}
          COVERAGE_PATH: ${{ matrix.coverage_summary_path }}
          COVERAGE_HTML_PATH: ${{ matrix.coverage_html_path }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          get_attr() {
            local line="$1"
            local attr="$2"

            printf '%s\n' "$line" | sed -n "s/.* ${attr}=\"\([^\"]*\)\".*/\1/p" | head -n 1
          }

          tests='n/a'
          failures='n/a'
          errors='n/a'
          skipped='n/a'
          time='n/a'

          if [ -n "$JUNIT_PATH" ] && [ -f "$JUNIT_PATH" ]; then
            junit_line=$(grep -m 1 -E '<testsuites|<testsuite ' "$JUNIT_PATH" || true)

            if [ -n "$junit_line" ]; then
              tests=$(get_attr "$junit_line" tests)
              failures=$(get_attr "$junit_line" failures)
              errors=$(get_attr "$junit_line" errors)
              skipped=$(get_attr "$junit_line" skipped)
              time=$(get_attr "$junit_line" time)
            fi
          fi

          line_coverage='n/a'
          branch_coverage='n/a'

          if [ -n "$COVERAGE_PATH" ] && [ -f "$COVERAGE_PATH" ]; then
            coverage_line=$(grep -m 1 '<coverage ' "$COVERAGE_PATH" || true)
            line_rate=$(get_attr "$coverage_line" 'line-rate')
            branch_rate=$(get_attr "$coverage_line" 'branch-rate')

            if [ -n "$line_rate" ]; then
              line_coverage=$(awk "BEGIN { printf \"%.2f%%\", $line_rate * 100 }")
            fi

            if [ -n "$branch_rate" ]; then
              branch_coverage=$(awk "BEGIN { printf \"%.2f%%\", $branch_rate * 100 }")
            fi
          fi

          {
            echo "## $SUMMARY_NAME test report"
            echo
            echo '| Metric | Value |'
            echo '| --- | ---: |'
            echo "| Tests | $tests |"
            echo "| Failures | $failures |"
            echo "| Errors | $errors |"
            echo "| Skipped | $skipped |"
            echo "| Duration | ${time}s |"
            echo "| Line coverage | $line_coverage |"
            echo "| Branch coverage | $branch_coverage |"
            echo
            echo "HTML coverage report is available in the \`$ARTIFACT_NAME\` artifact."
            if [ -n "$COVERAGE_HTML_PATH" ] && [ -f "$COVERAGE_HTML_PATH" ]; then
              echo "Entry point: \`$COVERAGE_HTML_PATH\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform
    needs: warm-cache
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Full Playwright suite (e2e/, specified by e2e/features/*.feature) against the local Docker stack: app, study group
  # API, fake Google IdP, Mailpit, contact API and consumer with LocalStack. Everything is local and fake: no secrets.
  # Pull requests only (not pushes, the schedule or manual runs), and the Docker images are pulled fresh, not cached.
  e2e:
    name: Quality / e2e
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: fbrissidev-e2e
    steps:
      - uses: actions/checkout@v7
      # The stack runs on the Alpine kooldev/node image (as `kool start` does), so its dependencies are installed there
      # and cached apart from the host ones (native packages differ).
      - id: deps
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: e2e-deps-v1-kooldev-node24-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      - if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        run: docker run --rm -v "$PWD:/app" -w /app kooldev/node:24 yarn install --frozen-lockfile
      - if: ${{ steps.deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: e2e-deps-v1-kooldev-node24-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}
      - name: Check the feature files against the tests
        run: docker run --rm -v "$PWD:/app" -w /app kooldev/node:24 node scripts/check-e2e-features.mjs
      - name: Start the stack
        run: |
          docker compose up -d --quiet-pull
          # Wait for the API through the Next.js proxy, then compile the pages once so the first tests don't time out.
          for _ in $(seq 1 90); do
            if docker compose exec -T app wget -qO /dev/null http://localhost:3000/api/study-group/me; then break; fi
            sleep 2
          done
          for path in / /pt-br /study-groups /pt-br/grupos-de-estudo-de-ingles /privacy /study-groups/my /study-groups/g/devtalk /study-groups/welcome; do
            docker compose exec -T app wget -qO /dev/null "http://localhost:3000${path}" || true
          done
      - name: Run the E2E suite
        run: bash e2e/run.sh
      - name: Upload the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Show the stack logs
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: ${{ always() }}
        run: |
          docker compose down -v --remove-orphans
          # The containers write as root into the checkout; hand it back to the runner user (self-hosted runners).
          docker run --rm -v "$PWD:/app" kooldev/node:24 chown -R "$(id -u):$(id -g)" /app

  # Compares terraform/cloudflare-token-permissions.json with terraform/*.tf and with the real Terraform Cloudflare
  # token, so a missing permission fails here instead of in the Terraform Cloud apply after merge.
  terraform-permissions:
    name: Terraform / Cloudflare token permissions
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: fbrissi/github-actions/.github/workflows/terraform-permissions.yml@v1
    permissions:
      contents: read
    with:
      change-pattern: '^(terraform/|\.github/workflows/quality-checks\.yml$)'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  quality-jobs:
    name: Quality Checks
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [quality, e2e, terraform, terraform-permissions, release-note]
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Validate quality results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          EVENT_NAME: ${{ github.event_name }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          TERRAFORM_PERMISSIONS_RESULT: ${{ needs.terraform-permissions.result }}
          RELEASE_NOTE_RESULT: ${{ needs.release-note.result }}
        run: |
          set -euo pipefail

          # The E2E suite runs on pull requests only; elsewhere it is skipped, which counts as passing.
          if [ "$EVENT_NAME" != 'pull_request' ] && [ "$E2E_RESULT" = 'skipped' ]; then
            E2E_RESULT=success
          fi

          if [ "$QUALITY_RESULT" != 'success' ] || [ "$E2E_RESULT" != 'success' ] || [ "$TERRAFORM_RESULT" != 'success' ] || [ "$TERRAFORM_PERMISSIONS_RESULT" != 'success' ]; then
            echo "Quality result: $QUALITY_RESULT"
            echo "E2E result: $E2E_RESULT"
            echo "Terraform result: $TERRAFORM_RESULT"
            echo "Terraform permissions result: $TERRAFORM_PERMISSIONS_RESULT"
            exit 1
          fi

          if [ "$RELEASE_NOTE_RESULT" != 'success' ] && [ "$RELEASE_NOTE_RESULT" != 'skipped' ]; then
            echo "Release note result: $RELEASE_NOTE_RESULT"
            exit 1
          fi

      - name: Dispatch Code Review and QA
        if: ${{ success() && github.event_name == 'pull_request' && vars.CODE_REVIEW_ENABLED != 'false' }}
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            // The default branch runs the callers, so a pull request cannot change its own reviewer or QA. They run in
            // parallel, and PR Feedback, QA, and Code Review join their verdicts for the head commit.
            for (const workflow of ['code-review.yml', 'qa.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                ref: context.payload.repository.default_branch,
                inputs: {
                  pr_number: String(pullRequest.number),
                },
              });
            }

  release-note:
    name: Quality / release-note
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    uses: fbrissi/github-actions/.github/workflows/release-note.yml@v1
    permissions:
      contents: read
