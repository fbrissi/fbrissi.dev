name: Release Orchestrator

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  release:
    name: Release
    if: ${{ github.event.pull_request.merged == true }}
    uses: fbrissi/github-actions/.github/workflows/release.yml@v1
    permissions:
      actions: write
      contents: write
    with:
      tfc-organization: fbrissi
      tfc-workspace: fbrissi-dev
      infrastructure-timeout-minutes: 360
      deploy-workflow: deploy.yml
    secrets:
      TFC_API_TOKEN: ${{ secrets.TFC_API_TOKEN }}
