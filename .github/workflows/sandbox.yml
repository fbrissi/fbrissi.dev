name: Deploy Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-sandbox
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Sandbox
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          APP_ENV: sandbox
          NEXT_PUBLIC_CONTACT_API_URL: https://sandbox.fbrissi.dev/api/contact
          NEXT_PUBLIC_OG_IMAGE: /images/og/og-image-profile.png
          NEXT_PUBLIC_SITE_URL: https://sandbox.fbrissi.dev
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          STUDY_GROUP_SLUG: ${{ secrets.STUDY_GROUP_SLUG }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy Cloudflare Pages sandbox
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}-sandbox --branch=sandbox
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy sandbox contact API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-api
          wranglerVersion: '4'
          secrets: TURNSTILE_SECRET_KEY
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - name: Deploy sandbox contact email Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-email-consumer
          wranglerVersion: '4'
      - name: List D1 databases
        id: d1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 list --json
      - name: Inject study group D1 database IDs
        env:
          D1_DATABASES: ${{ steps.d1.outputs.command-output }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const output = process.env.D1_DATABASES ?? "";
            const databases = JSON.parse(output.slice(output.indexOf("["), output.lastIndexOf("]") + 1));
            const file = "workers/study-group-api/wrangler.toml";
            let config = readFileSync(file, "utf8");
            for (const [placeholder, name] of [
              ["STUDY_GROUP_DB_ID", "fbrissi-dev-study-group"],
              ["STUDY_GROUP_SANDBOX_DB_ID", "fbrissi-dev-sandbox-study-group"],
            ]) {
              const database = databases.find((item) => item.name === name);
              if (!database?.uuid) throw new Error("D1 database not found: " + name);
              config = config.replace(JSON.stringify(placeholder), JSON.stringify(database.uuid));
            }
            writeFileSync(file, config);
          '
      - name: Apply study group D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-api
          wranglerVersion: '4'
          command: |
            d1 migrations apply fbrissi-dev-study-group --remote
            d1 migrations apply fbrissi-dev-sandbox-study-group --remote
      - name: Deploy sandbox study group API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-api
          wranglerVersion: '4'
          secrets: |
            STUDY_GROUP_ADMIN_EMAIL
            STUDY_GROUP_ADMIN_PASSWORD_HASH
            STUDY_GROUP_SESSION_SECRET
        env:
          STUDY_GROUP_ADMIN_EMAIL: ${{ secrets.STUDY_GROUP_ADMIN_EMAIL }}
          STUDY_GROUP_ADMIN_PASSWORD_HASH: ${{ secrets.STUDY_GROUP_ADMIN_PASSWORD_HASH }}
          STUDY_GROUP_SESSION_SECRET: ${{ secrets.STUDY_GROUP_SESSION_SECRET }}
