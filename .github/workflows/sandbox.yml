name: Deploy Sandbox

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-sandbox
  cancel-in-progress: true

jobs:
  # The sandbox is off (terraform/locals.tf `sandbox_enabled`), so its Pages project, D1, queues and SES key don't
  # exist. Set the repository variable SANDBOX_ENABLED to true only after enabling it in Terraform and applying.
  disabled:
    name: Sandbox disabled
    if: ${{ vars.SANDBOX_ENABLED != 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - run: echo "::notice::The sandbox is disabled. Enable it in terraform/locals.tf (sandbox_enabled), apply, then set the SANDBOX_ENABLED repository variable to true."
  deploy:
    name: Deploy Sandbox
    if: ${{ vars.SANDBOX_ENABLED == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check required study group secrets
        # Fails before anything is deployed or migrated, so a missing secret can't leave the API down on a new schema.
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          STUDY_GROUP_PLATFORM_ADMIN_EMAILS: ${{ secrets.STUDY_GROUP_PLATFORM_ADMIN_EMAILS }}
          STUDY_GROUP_SESSION_SECRET: ${{ secrets.STUDY_GROUP_SESSION_SECRET }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          STUDY_GROUP_UNSUBSCRIBE_SECRET: ${{ secrets.STUDY_GROUP_UNSUBSCRIBE_SECRET }}
          STUDY_GROUP_SANDBOX_SES_ACCESS_KEY_ID: ${{ secrets.STUDY_GROUP_SANDBOX_SES_ACCESS_KEY_ID }}
          STUDY_GROUP_SANDBOX_SES_SECRET_ACCESS_KEY: ${{ secrets.STUDY_GROUP_SANDBOX_SES_SECRET_ACCESS_KEY }}
          STUDY_GROUP_EMAIL_ALLOWLIST: ${{ secrets.STUDY_GROUP_EMAIL_ALLOWLIST }}
        run: |
          missing=0
          for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET STUDY_GROUP_PLATFORM_ADMIN_EMAILS STUDY_GROUP_SESSION_SECRET CLOUDFLARE_DEPLOY_API_TOKEN STUDY_GROUP_UNSUBSCRIBE_SECRET STUDY_GROUP_SANDBOX_SES_ACCESS_KEY_ID STUDY_GROUP_SANDBOX_SES_SECRET_ACCESS_KEY STUDY_GROUP_EMAIL_ALLOWLIST; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          APP_ENV: sandbox
          NEXT_PUBLIC_CONTACT_API_URL: https://sandbox.fbrissi.dev/api/contact
          NEXT_PUBLIC_OG_IMAGE: /images/og/og-image-profile.png
          NEXT_PUBLIC_SITE_URL: https://sandbox.fbrissi.dev
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          STUDY_GROUP_SLUG: ${{ secrets.STUDY_GROUP_SLUG }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy Cloudflare Pages sandbox
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}-sandbox --branch=sandbox
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy sandbox contact API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-api
          wranglerVersion: '4'
          environment: sandbox
          secrets: TURNSTILE_SECRET_KEY
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - name: Deploy sandbox contact email Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-email-consumer
          wranglerVersion: '4'
          environment: sandbox
      - name: List D1 databases
        id: d1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 list --json
      - name: Inject study group D1 database IDs
        env:
          D1_DATABASES: ${{ steps.d1.outputs.command-output }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const output = process.env.D1_DATABASES ?? "";
            const databases = JSON.parse(output.slice(output.indexOf("["), output.lastIndexOf("]") + 1));
            for (const file of ["workers/study-group-api/wrangler.toml", "workers/study-group-mailer/wrangler.toml"]) {
              let config = readFileSync(file, "utf8");
              for (const [placeholder, name] of [
                ["STUDY_GROUP_SANDBOX_DB_ID", "fbrissi-dev-sandbox-study-group"],
              ]) {
                const database = databases.find((item) => item.name === name);
                if (!database?.uuid) throw new Error("D1 database not found: " + name);
                config = config.replace(JSON.stringify(placeholder), JSON.stringify(database.uuid));
              }
              writeFileSync(file, config);
            }
          '
      - name: Apply sandbox study group D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-api
          wranglerVersion: '4'
          command: d1 migrations apply fbrissi-dev-sandbox-study-group --remote --env sandbox
      # Only the sandbox mailer (`--env sandbox`): it consumes the sandbox queue, reads the sandbox D1, sends with the
      # sandbox's own SES key and emails only the testers in STUDY_GROUP_EMAIL_ALLOWLIST.
      - name: Deploy sandbox study group mailer Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-mailer
          wranglerVersion: '4'
          environment: sandbox
          secrets: |
            STUDY_GROUP_SES_ACCESS_KEY_ID
            STUDY_GROUP_SES_SECRET_ACCESS_KEY
            STUDY_GROUP_UNSUBSCRIBE_SECRET
            STUDY_GROUP_EMAIL_ALLOWLIST
        env:
          STUDY_GROUP_SES_ACCESS_KEY_ID: ${{ secrets.STUDY_GROUP_SANDBOX_SES_ACCESS_KEY_ID }}
          STUDY_GROUP_SES_SECRET_ACCESS_KEY: ${{ secrets.STUDY_GROUP_SANDBOX_SES_SECRET_ACCESS_KEY }}
          STUDY_GROUP_UNSUBSCRIBE_SECRET: ${{ secrets.STUDY_GROUP_UNSUBSCRIBE_SECRET }}
          STUDY_GROUP_EMAIL_ALLOWLIST: ${{ secrets.STUDY_GROUP_EMAIL_ALLOWLIST }}
      - name: Deploy sandbox study group API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-api
          wranglerVersion: '4'
          environment: sandbox
          secrets: |
            GOOGLE_OAUTH_CLIENT_ID
            GOOGLE_OAUTH_CLIENT_SECRET
            STUDY_GROUP_PLATFORM_ADMIN_EMAILS
            STUDY_GROUP_SESSION_SECRET
            STUDY_GROUP_UNSUBSCRIBE_SECRET
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          STUDY_GROUP_PLATFORM_ADMIN_EMAILS: ${{ secrets.STUDY_GROUP_PLATFORM_ADMIN_EMAILS }}
          STUDY_GROUP_SESSION_SECRET: ${{ secrets.STUDY_GROUP_SESSION_SECRET }}
          STUDY_GROUP_UNSUBSCRIBE_SECRET: ${{ secrets.STUDY_GROUP_UNSUBSCRIBE_SECRET }}
