name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy, for example v1.0.0.
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate deployment tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Deployment tag must use Semantic Versioning: $TAG"
            exit 1
          fi

          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null
          tag_commit="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$tag_commit" "origin/main" || {
            echo "Deployment tag must point to a commit reachable from main: $TAG"
            exit 1
          }
      - name: Check required study group secrets
        # Fails before anything is deployed or migrated, so a missing secret can't leave the API down on a new schema.
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          STUDY_GROUP_PLATFORM_ADMIN_EMAILS: ${{ secrets.STUDY_GROUP_PLATFORM_ADMIN_EMAILS }}
          STUDY_GROUP_SESSION_SECRET: ${{ secrets.STUDY_GROUP_SESSION_SECRET }}
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          STUDY_GROUP_UNSUBSCRIBE_SECRET: ${{ secrets.STUDY_GROUP_UNSUBSCRIBE_SECRET }}
          STUDY_GROUP_SES_ACCESS_KEY_ID: ${{ secrets.STUDY_GROUP_SES_ACCESS_KEY_ID }}
          STUDY_GROUP_SES_SECRET_ACCESS_KEY: ${{ secrets.STUDY_GROUP_SES_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          for name in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET STUDY_GROUP_PLATFORM_ADMIN_EMAILS STUDY_GROUP_SESSION_SECRET CLOUDFLARE_DEPLOY_API_TOKEN STUDY_GROUP_UNSUBSCRIBE_SECRET STUDY_GROUP_SES_ACCESS_KEY_ID STUDY_GROUP_SES_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          APP_ENV: production
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_OG_IMAGE: ${{ vars.NEXT_PUBLIC_OG_IMAGE }}
          STUDY_GROUP_SLUG: ${{ secrets.STUDY_GROUP_SLUG }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Add production URLs to summary
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          {
            echo '## Production deployment'
            echo
            echo '- Site: https://fbrissi.dev'
            echo '- Pages production: https://fbrissi-dev.pages.dev'
            echo "- Pages deployment: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      # Releases before v0.4.1 bound the production contact email Worker to the sandbox queue as a consumer, which
      # blocks deleting the sandbox queues. Remove that consumer while the sandbox is disabled; once it is gone the
      # command fails harmlessly, so the step never blocks a deploy. The contact API deploy below drops its producer
      # binding to the same queue.
      - name: Unbind the sandbox contact queue from production
        if: ${{ vars.SANDBOX_ENABLED != 'true' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: queues consumer remove fbrissi-dev-sandbox-contact-form fbrissi-dev-contact-email-consumer
      - name: Deploy contact API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-api
          wranglerVersion: '4'
          secrets: TURNSTILE_SECRET_KEY
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - name: Deploy contact email Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-email-consumer
          wranglerVersion: '4'
      - name: List D1 databases
        id: d1
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 list --json
      - name: Inject study group D1 database IDs
        env:
          D1_DATABASES: ${{ steps.d1.outputs.command-output }}
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const output = process.env.D1_DATABASES ?? "";
            const databases = JSON.parse(output.slice(output.indexOf("["), output.lastIndexOf("]") + 1));
            for (const file of ["workers/study-group-api/wrangler.toml", "workers/study-group-mailer/wrangler.toml"]) {
              let config = readFileSync(file, "utf8");
              // Only the production database: the sandbox one exists only while the sandbox is enabled.
              for (const [placeholder, name] of [
                ["STUDY_GROUP_DB_ID", "fbrissi-dev-study-group"],
              ]) {
                const database = databases.find((item) => item.name === name);
                if (!database?.uuid) throw new Error("D1 database not found: " + name);
                config = config.replace(JSON.stringify(placeholder), JSON.stringify(database.uuid));
              }
              writeFileSync(file, config);
            }
          '
      - name: Apply study group D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-api
          wranglerVersion: '4'
          command: d1 migrations apply fbrissi-dev-study-group --remote
      # The mailer goes first, so the queue has its consumer before the API starts sending notifications.
      - name: Deploy study group mailer Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-mailer
          wranglerVersion: '4'
          secrets: |
            STUDY_GROUP_SES_ACCESS_KEY_ID
            STUDY_GROUP_SES_SECRET_ACCESS_KEY
            STUDY_GROUP_UNSUBSCRIBE_SECRET
        env:
          STUDY_GROUP_SES_ACCESS_KEY_ID: ${{ secrets.STUDY_GROUP_SES_ACCESS_KEY_ID }}
          STUDY_GROUP_SES_SECRET_ACCESS_KEY: ${{ secrets.STUDY_GROUP_SES_SECRET_ACCESS_KEY }}
          STUDY_GROUP_UNSUBSCRIBE_SECRET: ${{ secrets.STUDY_GROUP_UNSUBSCRIBE_SECRET }}
      - name: Deploy study group API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/study-group-api
          wranglerVersion: '4'
          secrets: |
            GOOGLE_OAUTH_CLIENT_ID
            GOOGLE_OAUTH_CLIENT_SECRET
            STUDY_GROUP_PLATFORM_ADMIN_EMAILS
            STUDY_GROUP_SESSION_SECRET
            STUDY_GROUP_UNSUBSCRIBE_SECRET
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          STUDY_GROUP_PLATFORM_ADMIN_EMAILS: ${{ secrets.STUDY_GROUP_PLATFORM_ADMIN_EMAILS }}
          STUDY_GROUP_SESSION_SECRET: ${{ secrets.STUDY_GROUP_SESSION_SECRET }}
          STUDY_GROUP_UNSUBSCRIBE_SECRET: ${{ secrets.STUDY_GROUP_UNSUBSCRIBE_SECRET }}
