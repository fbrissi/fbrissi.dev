name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy, for example v1.0.0.
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate deployment tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Deployment tag must use Semantic Versioning: $TAG"
            exit 1
          fi

          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null
          tag_commit="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$tag_commit" "origin/main" || {
            echo "Deployment tag must point to a commit reachable from main: $TAG"
            exit 1
          }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          APP_ENV: production
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_OG_IMAGE: ${{ vars.NEXT_PUBLIC_OG_IMAGE }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Add production URLs to summary
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          {
            echo '## Production deployment'
            echo
            echo '- Site: https://fbrissi.dev'
            echo '- Pages production: https://fbrissi-dev.pages.dev'
            echo "- Pages deployment: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy contact API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-api
          wranglerVersion: '4'
          secrets: TURNSTILE_SECRET_KEY
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - name: Deploy contact email Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/contact-email-consumer
          wranglerVersion: '4'
