name: PR Fix

# Dispatched by the quality join (PR Feedback, QA, and Code Review) on the default branch, so a pull request cannot
# change its own fixer.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to fix
        required: true
        type: string
      instructions:
        description: Extra instructions for this run only, appended to the agent prompt.
        required: false
        type: string

permissions: {}

jobs:
  pr-fix:
    name: PR Fix
    if: github.ref == 'refs/heads/main'
    uses: fbrissi/github-actions/.github/workflows/pr-fix.yml@v1
    permissions:
      checks: write
      issues: read
      pull-requests: read
    with:
      pr-number: ${{ inputs.pr_number }}
      instructions: ${{ inputs.instructions }}
      # Release branches into main and the dependency updates (hotfix/ into main, bugfix/ into a release); other pull
      # requests opt in with the ai:auto-fix label.
      branch-prefixes: release/ hotfix/ bugfix/
      max-rounds: 3
      # Also fixes the QA report of the newest failing AI QA check run on the head commit (qa.yml).
      qa-check-name: AI QA
      environment: code-review
      ai-skills-ref: v0.15.0
      harness: ${{ vars.AI_HARNESS }}
      opencode-model: ${{ vars.OPENCODE_MODEL }}
      opencode-variant: ${{ vars.OPENCODE_VARIANT }}
      claude-model: ${{ vars.CLAUDE_MODEL }}
      claude-effort: ${{ vars.CLAUDE_EFFORT }}
      node-version: "24"
      node-cache: yarn
      install-command: yarn install --frozen-lockfile
      dependency-cache-path: node_modules
      dependency-cache-prefix: code-review-deps-v1-node24
      dependency-cache-files: yarn.lock
    secrets:
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      OPEN_AI_TOKEN: ${{ secrets.OPEN_AI_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
