name: PR Feedback

# Joins each review with the AI QA check of the same head commit (fbrissi/github-actions README, Review and QA in
# separate jobs), and dispatches PR Fix or Merge Decision on the default branch, so a pull request cannot change its own
# fixer or merger.
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  join:
    name: PR Feedback
    uses: fbrissi/github-actions/.github/workflows/quality-join.yml@v1
    permissions:
      actions: write
      checks: read
      pull-requests: write
    # No ignore-authors: one App (AGENT_APP_*) reviews and fixes, and replies to existing threads never ask for a fix.
